<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./addVideo.css">
    <title>Add  Video</title>
</head>

<body>
    <div class="container">
        <div class="form-container">
            <form onsubmit="addVideo(event)" id="videoForm" method="POST">
                <div><span class="login-txt"> ADD.VIDEO</span></div>
                <div class="form-row"><input type="text" name="title" id="title" placeholder="Title"> <span
                        class="clienterr" id="title-err"></span>
                </div>
                <div class="form-row"><input type="file" name="file" id="videoInput"> <span
                        class="clienterr" id="file-err"></span>
                </div>


                <div class="login-btn">
                    <button> <ion-icon name="add"></ion-icon> Add
                    </button>
                </div>

            </form>
            <div class="img-section">
                <span>Add Video</span>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="./script.js"></script>
</body>

</html>
